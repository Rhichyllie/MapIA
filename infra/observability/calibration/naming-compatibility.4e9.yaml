notes:
- O profile default reflete o naming canonico assumido nos artefatos versionados 4E.8.
- Use profiles alternativos no script de apply para compatibilizar collector/backend
  sem editar dashboards/rules manualmente.
- Validar profile final contra metricas reais do ambiente alvo antes do apply definitivo.
- 4E.9 adiciona metadados de validacao por evidencia real; sem evidencias reais, o
  profile default pode permanecer candidato (nao validado).
- 'Escopo dev_local: evidencias reais locais nao promovem automaticamente default_profile
  global de staging/producao.'
